app:
  kafka:
    consumer:
      bootstrap-servers: "localhost:9092"
      group-id: "analyzer"
    topic:
      user-actions: "stats.user-actions.v1"
      events-similarity: "stats.events-similarity.v1"
  action-weight:
    view: 0.4
    register: 0.8
    like: 1.0

grpc:
  server:
    port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:6546/ewm
    driverClassName: org.postgresql.Driver
    username: ewm
    password: ewm